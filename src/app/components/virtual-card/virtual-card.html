<div
  class="relative  aspect-[1.586/1] w-full  overflow-hidden rounded-2xl p-6 text-white shadow-xl"
  [style.background]="background()"
>
  <div
    class="pointer-events-none absolute -right-10 -top-16 h-48 w-48 rounded-full opacity-25 blur-3xl"
    [style.background]="theme().glow"
  ></div>

  @if (logo()) {
    <img
      [src]="logo()"
      alt=""
      aria-hidden="true"
      class="pointer-events-none absolute top-2/5 left-1/2 -translate-x-1/2 -translate-y-1/2   h-52 w-52 object-contain opacity-50"
    />
  }

  <div
    class="pointer-events-none absolute inset-0 bg-gradient-to-t from-black/35 via-transparent to-white/10"
  ></div>

  <div class="relative flex items-start justify-between">
    <div class="h-9 w-12 rounded-md bg-gradient-to-br from-amber-200 to-amber-500 shadow-sm"></div>
    <div class="text-right">
      <span class="text-sm font-semibold italic tracking-wide">VISA · USD</span>
      <p class="mt-1 text-[10px] font-medium uppercase tracking-[0.18em] text-white/60">
        {{ card().service }} only
      </p>
    </div>
  </div>

  <p class="relative mt-8 font-mono text-xl tracking-widest sm:text-2xl">{{ displayNumber() }}</p>

  <div class="relative mt-5 flex items-end justify-between text-xs">
    <div>
      <p class="text-white/60">Card holder</p>
      <p class="font-medium">{{ card().holder }}</p>
    </div>
    <div>
      <p class="text-white/60">Expires</p>
      <p class="font-mono">{{ card().expiry }}</p>
    </div>
    <div>
      <p class="text-white/60">CVV</p>
      <p class="font-mono">{{ revealed() ? card().cvv : '•••' }}</p>
    </div>
  </div>
</div>

<div class="mt-3 flex max-w-sm gap-2">
  <button
    type="button"
    (click)="revealed.set(!revealed())"
    class="flex-1 rounded-lg border border-[#0F2A24]/20 bg-white px-3 py-2 text-sm font-medium transition hover:bg-gray-50"
  >
    {{ revealed() ? 'Hide details' : 'Reveal details' }}
  </button>
  <button
    type="button"
    (click)="copy()"
    class="flex-1 rounded-lg bg-[#0B6B5B] px-3 py-2 text-sm font-medium text-white transition hover:bg-[#095647]"
  >
    {{ copied() ? 'Copied' : 'Copy number' }}
  </button>
</div>
